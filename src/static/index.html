<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div id="auth-container">
        <button id="login-toggle" type="button">Sign in</button>
        <div id="user-info" class="hidden">
          <span id="current-user"></span>
          <button id="logout-button" type="button">Sign out</button>
        </div>
        <form id="login-form" class="hidden">
          <label for="login-email">School email</label>
          <input id="login-email" type="email" autocomplete="username" required />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">Sign in</button>
        </form>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="signup-prompt">Sign in with your school account to register.</p>
        <form id="signup-form" class="hidden">
          <div id="target-email-group" class="form-group hidden">
            <label for="target-email">Student email:</label>
            <input
              type="email"
              id="target-email"
              placeholder="student@mergington.edu"
            />
          </div>
          <div class="form-group">
            <label id="registered-user-label"></label>
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
